# metamodel_version: 1.11.0
# version: 1.2
enum NodeType
  {
    actor
    ecosystem
    system
    service
    database
    network
    ldap
    webclient
    data_asset
  }

enum Protocol
  {
    HTTP
    HTTPS
    FTP
    SFTP
    JDBC
    WebSocket
    SocketIO
    LDAP
    AMQP
    TLS
    mTLS
    TCP
  }

enum RatePerUnit
  {
    nanosecond
    microsecond
    millisecond
    second
    minute
    hour
    day
    week
    month
    quarter
    year
  }

enum RelationshipKind
  {
    interacts
    connects
    deployed_in
    composed_of
    options
  }

enum TimeUnitName
  {
    nanoseconds
    microseconds
    milliseconds
    seconds
    minutes
    hours
    days
    weeks
    months
    quarters
    years
  }

enum TransitionDirection
  {
    source_to_destination
    destination_to_source
  }

type Architecture
  {
    nodes: [Node]
    relationships: [Relationship]
    metadata: Metadata
    controls: Control
    flows: [Flow]
    adrs: [String]
  }

type ComposedOfRelationship
  {
    container: String!
    nodes: [Node]!
  }

type ConnectsRelationship
  {
    source: NodeInterface!
    destination: NodeInterface!
  }

type Control
  {
  }

type ControlDetail
  {
    requirementUrl: String!
    configUrl: String
    config: Metadata
  }

type ControlRequirement
  {
    controlId: String!
    name: String!
    description: String!
  }

type Decision
  {
    description: String!
    nodes: [Node]!
    relationships: [Relationship]!
    controls: Control
  }

type Decorator
  {
    uniqueId: String!
    type: String!
    target: [String]!
    appliesTo: [String]!
    data: Metadata!
  }

type DeployedInRelationship
  {
    container: String!
    nodes: [Node]!
  }

type EvidenceDocument
  {
    evidence: Metadata!
  }

type Flow
  {
    uniqueId: String!
    name: String!
    description: String!
    requirementUrl: String
    transitions: [Transition]!
    controls: Control
    metadata: Metadata
  }

type InteractsRelationship
  {
    actor: String!
    nodes: [Node]!
  }

type InterfaceDefinition
  {
    uniqueId: String!
    definitionUrl: String!
    config: Metadata!
  }

type InterfaceType
  {
    uniqueId: String!
  }

type Node
  {
    uniqueId: String!
    nodeType: NodeType!
    name: String!
    description: String!
    details: Metadata
    interfaces: [InterfaceDefinition]
    controls: Control
    metadata: Metadata
  }

type NodeInterface
  {
    node: String!
    interfaces: [InterfaceDefinition]
  }

type NodeMoment
  {
    uniqueId: String!
    name: String!
    description: String!
    controls: Control
    metadata: Metadata
    nodeType: NodeType!
    validFrom: String
    adrs: [String]
    interfaces: [InterfaceDefinition]
    details: Metadata!
  }

type OptionList
  {
    decisions: [Decision]
  }

type RateUnit
  {
    rate: Float!
    per: RatePerUnit!
  }

type Relationship
  {
    uniqueId: String!
    description: String
    relationshipType: RelationshipType!
    protocol: Protocol
    metadata: Metadata
    controls: Control
  }

type RelationshipType
  {
    interacts: InteractsRelationship
    connects: ConnectsRelationship
    deployedIn: DeployedInRelationship
    composedOf: ComposedOfRelationship
    options: [Decision]
  }

type Timeline
  {
    currentMoment: String
    moments: [String]!
    metadata: Metadata
  }

type TimeUnit
  {
    unit: TimeUnitName!
    value: Float!
  }

type Transition
  {
    relationshipUniqueId: String!
    sequenceNumber: Int!
    description: String!
    direction: TransitionDirection
  }
