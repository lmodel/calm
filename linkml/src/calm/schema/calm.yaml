# Source of truth: linkml/scripts/calm_to_linkml.py + calm/release/1.2/meta/*.json
id: https://w3id.org/lmodel/calm
name: calm
title: Common Architecture Language Model (CALM)
description: >-
  LinkML representation of the FINOS Common Architecture Language Model (CALM) 1.2
  specification. CALM is a declarative, JSON-based modeling language for describing
  complex software architectures (nodes, relationships, controls, flows, decorators,
  timelines, evidence, and units). This LinkML schema is generated from the CALM
  JSON-Schema meta files.
license: Apache-2.0
see_also:
  - https://calm.finos.org/
  - https://github.com/finos/architecture-as-code
source: https://calm.finos.org/release/1.2/meta/calm.json
version: '1.2'


prefixes:
  calm: https://w3id.org/lmodel/calm/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  dct: http://purl.org/dc/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#
  owl: http://www.w3.org/2002/07/owl#
  prov: http://www.w3.org/ns/prov#
  finos_calm: https://calm.finos.org/release/1.2/meta/
  ai_governance_framework: https://w3id.org/lmodel/ai-governance-framework/
  attack: https://w3id.org/lmodel/attack/
  capec: https://w3id.org/lmodel/capec/
  cis_controls: https://w3id.org/lmodel/cis-controls/
  dpv: https://w3id.org/lmodel/dpv/
  fluxnova_bpmn_platform: https://w3id.org/lmodel/fluxnova-bpm-platform/
  gist: https://w3id.org/lmodel/gist/
  iso27001: https://w3id.org/lmodel/iso27001/
  nist_csf_v2: https://w3id.org/lmodel/nist-csf-v2/
  nist_sp_800_53: https://w3id.org/lmodel/nist-sp-800-53/
  ocsf: https://w3id.org/lmodel/ocsf/
  oscal: https://w3id.org/lmodel/oscal/
  stix: https://w3id.org/lmodel/stix/
default_prefix: calm
default_range: string


imports:
  - linkml:types


subsets:
  core:
    description: Core architecture vocabulary (nodes, relationships, decisions).

  control_framework:
    description: 'Control framework: controls, requirements, evidence.'

  flow_modeling:
    description: 'Business flow modeling: flows and transitions.'

  interface_defs:
    description: Interface definitions exposed by nodes.

  decorators:
    description: Cross-cutting decorators that annotate elements.

  timeline:
    description: Time-based architecture snapshots (moments).

  units:
    description: Quantity and rate unit primitives.


types:
  CronExpression:
    uri: xsd:string
    base: str
    description: A Unix-style cron expression (minute, hour, day, month, weekday).
    pattern: ^([0-5]?\d)\s([01]?\d|2[0-3])\s(3[01]|[12]\d|0?[1-9])\s(1[0-2]|0?[1-9])\s([0-6])$

  Metadata:
    uri: xsd:string
    base: str
    description: >-
      Opaque key/value metadata payload. JSON-Schema allows either an object or
      an array of objects; in LinkML this is modeled as a permissive string type
      that downstream consumers parse as JSON.


enums:
  Protocol:
    description: Wire-level protocol used by a relationship.
    permissible_values:
      HTTP:
        description: The HTTP protocol.
        meaning: calm:protocol/HTTP
      HTTPS:
        description: The HTTPS protocol.
        meaning: calm:protocol/HTTPS
      FTP:
        description: The FTP protocol.
        meaning: calm:protocol/FTP
      SFTP:
        description: The SFTP protocol.
        meaning: calm:protocol/SFTP
      JDBC:
        description: The JDBC protocol.
        meaning: calm:protocol/JDBC
      WebSocket:
        description: The WebSocket protocol.
        meaning: calm:protocol/WebSocket
      SocketIO:
        description: The SocketIO protocol.
        meaning: calm:protocol/SocketIO
      LDAP:
        description: The LDAP protocol.
        meaning: calm:protocol/LDAP
      AMQP:
        description: The AMQP protocol.
        meaning: calm:protocol/AMQP
      TLS:
        description: The TLS protocol.
        meaning: calm:protocol/TLS
      mTLS:
        description: The mTLS protocol.
        meaning: calm:protocol/mTLS
      TCP:
        description: The TCP protocol.
        meaning: calm:protocol/TCP

  NodeType:
    description: >-
      Category of architecture node. The CALM JSON-Schema allows arbitrary strings;
      this enum lists the canonical values plus an escape hatch via ``any_of`` on
      the slot.
    permissible_values:
      actor:
        description: A actor node.
        meaning: calm:node-type/actor
      ecosystem:
        description: A ecosystem node.
        meaning: calm:node-type/ecosystem
      system:
        description: A system node.
        meaning: calm:node-type/system
      service:
        description: A service node.
        meaning: calm:node-type/service
      database:
        description: A database node.
        meaning: calm:node-type/database
      network:
        description: A network node.
        meaning: calm:node-type/network
      ldap:
        description: A ldap node.
        meaning: calm:node-type/ldap
      webclient:
        description: A webclient node.
        meaning: calm:node-type/webclient
      data_asset:
        description: A data-asset node.
        meaning: calm:node-type/data-asset

  TimeUnitName:
    description: Named unit of time used by ``TimeUnit``.
    permissible_values:
      nanoseconds:
        description: 'Time unit: nanoseconds.'
      microseconds:
        description: 'Time unit: microseconds.'
      milliseconds:
        description: 'Time unit: milliseconds.'
      seconds:
        description: 'Time unit: seconds.'
      minutes:
        description: 'Time unit: minutes.'
      hours:
        description: 'Time unit: hours.'
      days:
        description: 'Time unit: days.'
      weeks:
        description: 'Time unit: weeks.'
      months:
        description: 'Time unit: months.'
      quarters:
        description: 'Time unit: quarters.'
      years:
        description: 'Time unit: years.'

  RatePerUnit:
    description: Time interval denominator used by ``RateUnit``.
    permissible_values:
      nanosecond:
        description: 'Rate denominator: per nanosecond.'
      microsecond:
        description: 'Rate denominator: per microsecond.'
      millisecond:
        description: 'Rate denominator: per millisecond.'
      second:
        description: 'Rate denominator: per second.'
      minute:
        description: 'Rate denominator: per minute.'
      hour:
        description: 'Rate denominator: per hour.'
      day:
        description: 'Rate denominator: per day.'
      week:
        description: 'Rate denominator: per week.'
      month:
        description: 'Rate denominator: per month.'
      quarter:
        description: 'Rate denominator: per quarter.'
      year:
        description: 'Rate denominator: per year.'

  TransitionDirection:
    description: Direction of flow on a transition.
    permissible_values:
      source_to_destination:
        description: 'Flow direction: source-to-destination.'
      destination_to_source:
        description: 'Flow direction: destination-to-source.'

  RelationshipKind:
    description: >-
      Discriminator for the variant of a ``relationship-type``: exactly one of the
      following keys is set on a relationship's ``relationship-type``.
    permissible_values:
      interacts:
        description: Actor-to-nodes interaction.
      connects:
        description: Interface-to-interface connection.
      deployed_in:
        description: 'Containment: nodes deployed in a container.'
      composed_of:
        description: 'Composition: nodes composed by a container.'
      options:
        description: A set of alternative decisions.


slots:
  nodes:
    range: Node
    multivalued: true

  relationships:
    range: Relationship
    multivalued: true

  metadata:
    range: Metadata

  controls:
    range: Control

  flows:
    range: Flow
    multivalued: true

  adrs:
    description: >-
      External links to ADRs (Architecture Decision Records) or similar documents
      that provide context or decisions related to the architecture. These can be
      URLs or references to internal documentation.
    range: string
    multivalued: true

  unique_id:
    range: string
    required: true
    identifier: true
    slot_uri: schema:identifier
    aliases:
      - unique-id
    description: Stable opaque identifier used to cross-link CALM elements.

  node_type:
    range: NodeType
    required: true
    aliases:
      - node-type
    description: Category of the node (system, service, actor, etc.).
    any_of:
      - range: NodeType
      - range: string

  name:
    range: string
    required: true
    slot_uri: rdfs:label
    description: Short human-readable name.

  description:
    range: string
    slot_uri: dct:description
    description: Free-form description of the element.

  details:
    range: Metadata

  interfaces:
    range: InterfaceDefinition
    multivalued: true
    description: Interface definitions exposed by nodes.

  relationship_type:
    range: RelationshipType
    required: true
    aliases:
      - relationship-type

  protocol:
    range: Protocol

  actor:
    range: string
    required: true

  source:
    range: NodeInterface
    required: true

  destination:
    range: NodeInterface
    required: true

  container:
    range: string
    required: true

  requirement_url:
    description: The requirement schema that specifies how a control should be defined
    range: string
    aliases:
      - requirement-url
    slot_uri: schema:url

  config_url:
    description: The configuration of how the control requirement schema is met
    range: string
    aliases:
      - config-url
    slot_uri: schema:url

  config:
    description: Inline configuration of how the control requirement schema is met
    range: Metadata

  control_id:
    description: >-
      The unique identifier of this control, which has the potential to be used
      for linking evidence
    range: string
    required: true
    aliases:
      - control-id
    identifier: true

  type:
    description: Type of decorator - a free-form string identifying the decorator
      category
    range: string
    required: true

  target:
    description: >-
      Array of file paths or URLs referencing the CALM documents (patterns, architectures,
      or controls) this decorator targets
    range: string
    multivalued: true
    required: true

  applies_to:
    description: >-
      Array of unique-ids referencing nodes, relationships, flows, or other architecture
      elements
    range: string
    multivalued: true
    required: true
    aliases:
      - applies-to

  data:
    description: Free-form JSON object containing the decorator's data
    range: Metadata
    required: true

  evidence:
    range: Metadata
    required: true

  relationship_unique_id:
    description: Unique identifier for the relationship in the architecture
    range: string
    required: true
    aliases:
      - relationship-unique-id

  sequence_number:
    description: Indicates the sequence of the relationship in the flow
    range: integer
    required: true
    aliases:
      - sequence-number
    minimum_value: 1

  direction:
    range: TransitionDirection
    description: Direction of flow on the transition.

  transitions:
    range: Transition
    multivalued: true
    required: true

  definition_url:
    description: URI of the external schema this interface configuration conforms
      to
    range: string
    required: true
    aliases:
      - definition-url
    slot_uri: schema:url

  node:
    range: string
    required: true

  current_moment:
    description: The unique-id of the current architecture moment within the timeline.
    range: string
    aliases:
      - current-moment

  moments:
    description: >-
      A list of significant architecture states or points in time, each represented
      as a 'moment'.
    range: string
    multivalued: true
    required: true

  valid_from:
    description: The date when this architecture moment came into effect.
    range: date
    annotations:
      json_format: date
    aliases:
      - valid-from
    slot_uri: prov:startedAtTime

  unit:
    description: The unit of time (e.g., seconds, minutes, hours).
    range: TimeUnitName
    required: true

  value:
    description: The numeric value representing the amount of time.
    range: float
    minimum_value: 0
    required: true

  rate:
    description: The numeric value representing the rate.
    range: float
    minimum_value: 0
    required: true

  per:
    description: The time unit defining the rate interval.
    range: RatePerUnit
    required: true

  url:
    range: string
    slot_uri: schema:url

  control_config_url:
    range: string
    aliases:
      - control-config-url
    slot_uri: schema:url

  evidence_paths:
    range: string
    aliases:
      - evidence-paths
    multivalued: true
    description: Paths (filesystem or URL) pointing at supporting evidence.

  decisions:
    range: Decision
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Alternative decisions under an ``options`` relationship.

  interacts:
    range: InteractsRelationship
    inlined: true

  connects:
    range: ConnectsRelationship
    inlined: true

  deployed_in:
    aliases:
      - deployed-in
    range: DeployedInRelationship
    inlined: true

  composed_of:
    aliases:
      - composed-of
    range: ComposedOfRelationship
    inlined: true

  options:
    range: Decision
    multivalued: true
    inlined: true
    inlined_as_list: true


classes:
  Architecture:
    title: Common Architecture Language Model (CALM) Vocab
    slots:
      - nodes
      - relationships
      - metadata
      - controls
      - flows
      - adrs
    tree_root: true
    description: Top-level CALM architecture document.
    class_uri: calm:Architecture
    in_subset:
      - core
    close_mappings:
      - schema:SoftwareApplication
      - gist:System
    related_mappings:
      - capec:Category
      - cis_controls:CISControlsDocument
      - dpv:Context
      - iso27001:InformationSecurityManagementSystem
      - nist_csf_v2:CSFDocument
      - nist_sp_800_53:Catalog
      - oscal:SystemSecurityPlan
      - stix:Bundle
    slot_usage:
      nodes:
        inlined: true
        inlined_as_list: true
      relationships:
        inlined: true
        inlined_as_list: true
      flows:
        inlined: true
        inlined_as_list: true

  Node:
    slots:
      - unique_id
      - node_type
      - name
      - description
      - details
      - interfaces
      - controls
      - metadata
    description: >-
      A logical or physical element of an architecture (system, service, actor,
      ...).
    class_uri: calm:Node
    in_subset:
      - core
    close_mappings:
      - schema:Thing
      - attack:Asset
      - gist:NetworkNode
      - iso27001:Asset
      - ocsf:Node
      - ocsf:Actor
    broad_mappings:
      - stix:StixDomainObject
    related_mappings:
      - capec:AttackPattern
      - cis_controls:Safeguard
      - dpv:DataController
      - oscal:SspInventoryItem
    slot_usage:
      interfaces:
        inlined: true
        inlined_as_list: true
      description:
        required: true

  Relationship:
    slots:
      - unique_id
      - description
      - relationship_type
      - protocol
      - metadata
      - controls
    description: A typed link between architecture elements.
    class_uri: calm:Relationship
    in_subset:
      - core
    close_mappings:
      - gist:NetworkLink
      - stix:StixRelationshipObject
    related_mappings:
      - prov:wasInfluencedBy
      - attack:AttackRelationship
      - ocsf:NetworkEndpoint

  InteractsRelationship:
    slots:
      - actor
      - nodes
    description: An ``interacts`` relationship between an actor and one or more
      nodes.
    class_uri: calm:InteractsRelationship
    in_subset:
      - core
    slot_usage:
      nodes:
        required: true

  ConnectsRelationship:
    slots:
      - source
      - destination
    description: A ``connects`` relationship between two node interfaces.
    class_uri: calm:ConnectsRelationship
    in_subset:
      - core

  DeployedInRelationship:
    slots:
      - container
      - nodes
    description: A ``deployed-in`` containment relationship.
    class_uri: calm:DeployedInRelationship
    in_subset:
      - core
    slot_usage:
      nodes:
        required: true

  ComposedOfRelationship:
    slots:
      - container
      - nodes
    description: A ``composed-of`` containment relationship.
    class_uri: calm:ComposedOfRelationship
    in_subset:
      - core
    slot_usage:
      nodes:
        required: true

  Decision:
    slots:
      - description
      - nodes
      - relationships
      - controls
    description: A candidate decision within an ``options`` relationship.
    class_uri: calm:Decision
    in_subset:
      - core
    slot_usage:
      nodes:
        inlined: true
        inlined_as_list: true
        required: true
      relationships:
        inlined: true
        inlined_as_list: true
        required: true
      description:
        required: true

  ControlDetail:
    slots:
      - requirement_url
      - config_url
      - config
    description: A single control requirement and its inline / referenced configuration.
    class_uri: calm:ControlDetail
    close_mappings:
      - dpv:TechnicalMeasure
      - oscal:SspImplementedRequirement
    related_mappings:
      - nist_sp_800_53:ControlGroup
    in_subset:
      - control_framework
    slot_usage:
      requirement_url:
        required: true

  Control:
    description: A named control attached to an architecture element.
    class_uri: calm:Control
    in_subset:
      - control_framework
    close_mappings:
      - attack:Mitigation
      - cis_controls:Safeguard
      - dpv:TechnicalOrganisationalMeasure
      - iso27001:SecurityControl
      - nist_csf_v2:CSFSubcategory
      - nist_sp_800_53:Control
      - ocsf:Compliance
      - oscal:Control
    related_mappings:
      - schema:Action
      - capec:Category
      - stix:Core

  ControlRequirement:
    title: Common Architecture Language Model Control Requirement
    description: Domain-defined control requirement that controls can reference.
    slots:
      - control_id
      - name
      - description
    class_uri: calm:ControlRequirement
    close_mappings:
      - cis_controls:CISControl
      - dpv:OrganisationalMeasure
      - iso27001:SecurityControl
      - nist_csf_v2:CSFCategory
      - oscal:Control
    related_mappings:
      - attack:Technique
      - capec:View
      - nist_sp_800_53:ControlEnhancement
    in_subset:
      - control_framework
    slot_usage:
      description:
        required: true

  Decorator:
    slots:
      - unique_id
      - type
      - target
      - applies_to
      - data
    description: Cross-cutting annotation attached to nodes, relationships, or flows.
    class_uri: calm:Decorator
    related_mappings:
      - iso27001:MonitoringItem
      - nist_csf_v2:Link
      - stix:ExtensionDefinition
    in_subset:
      - decorators

  EvidenceDocument:
    title: Common Architecture Language Model Evidence
    description: >-
      Top-level CALM evidence document linking control configurations to evidence
      artefacts.
    slots:
      - evidence
    class_uri: calm:EvidenceDocument
    close_mappings:
      - iso27001:DocumentedInformation
      - ocsf:Evidences
      - oscal:AssessmentResults
    related_mappings:
      - dpv:LegalMeasure
    in_subset:
      - control_framework

  Transition:
    slots:
      - relationship_unique_id
      - sequence_number
      - description
      - direction
    description: A single step in a flow, anchored on a relationship.
    class_uri: calm:Transition
    close_mappings:
      - fluxnova_bpmn_platform:SequenceFlow
    in_subset:
      - flow_modeling
    slot_usage:
      description:
        required: true

  Flow:
    slots:
      - unique_id
      - name
      - description
      - requirement_url
      - transitions
      - controls
      - metadata
    description: Business flow mapped onto architecture relationships.
    class_uri: calm:Flow
    close_mappings:
      - fluxnova_bpmn_platform:FlowElement
    related_mappings:
      - attack:Tactic
      - fluxnova_bpmn_platform:SubProcess
      - gist:ServiceSpecification
      - iso27001:OperationalProcedure
      - nist_csf_v2:CSFFunction
      - ocsf:NetworkTraffic
      - oscal:SspControlImplementation
    in_subset:
      - flow_modeling
    slot_usage:
      description:
        required: true

  InterfaceDefinition:
    description: Modular interface definition referencing an external schema.
    slots:
      - unique_id
      - definition_url
      - config
    class_uri: calm:InterfaceDefinition
    close_mappings:
      - ocsf:NetworkInterface
    related_mappings:
      - gist:Network
    in_subset:
      - interface_defs
    slot_usage:
      config:
        required: true

  InterfaceType:
    slots:
      - unique_id
    description: Inline (free-form) interface definition keyed by unique-id.
    class_uri: calm:InterfaceType
    in_subset:
      - interface_defs

  NodeInterface:
    slots:
      - node
      - interfaces
    description: Reference to one or more interfaces exposed by a node.
    class_uri: calm:NodeInterface
    in_subset:
      - interface_defs
    slot_usage:
      interfaces:
        inlined: true
        inlined_as_list: true

  Timeline:
    title: Common Architecture Language Model (CALM) Timelines Vocab
    slots:
      - current_moment
      - moments
      - metadata
    tree_root: true
    description: CALM timeline document capturing architecture moments over time.
    class_uri: calm:Timeline
    related_mappings:
      - fluxnova_bpmn_platform:Process
      - gist:TemporalRelation
      - iso27001:ManagementReview
      - oscal:AssessmentResultsDocument
    in_subset:
      - timeline

  NodeMoment:
    slots:
      - node_type
      - valid_from
      - adrs
      - interfaces
    is_a: Node
    description: An architecture moment - a point-in-time snapshot of the architecture.
    class_uri: calm:NodeMoment
    related_mappings:
      - fluxnova_bpmn_platform:FlowNode
      - fluxnova_bpmn_platform:EndEvent
    in_subset:
      - timeline
    slot_usage:
      details:
        required: true

  TimeUnit:
    description: A quantity of time expressed as a numeric value and a unit.
    slots:
      - unit
      - value
    class_uri: calm:TimeUnit
    in_subset:
      - units
    exact_mappings:
      - schema:Duration

  RateUnit:
    description: A rate (count per time unit), e.g. operations per second.
    slots:
      - rate
      - per
    class_uri: calm:RateUnit
    in_subset:
      - units

  OptionList:
    description: >-
      Wrapper around the list of ``Decision`` alternatives in an options relationship.
    slots:
      - decisions

  RelationshipType:
    description: >-
      Tagged-union container for the variant body of a relationship. Exactly one
      of ``interacts``, ``connects``, ``deployed_in``, ``composed_of``, ``options``
      is populated; see ``RelationshipKind`` for the discriminator values.
    slots:
      - interacts
      - connects
      - deployed_in
      - composed_of
      - options
    class_uri: calm:RelationshipType
    in_subset:
      - core
