# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  # This project's own workflows. Every action is pinned to a commit SHA with
  # its version in a trailing comment; Dependabot bumps both together. A SHA pin
  # goes stale silently: actionlint catches syntax drift, not age. FINOS's own
  # workflows stay as FINOS writes them, since a test holds them to the pin; the
  # globs below cover each of their names, and none of this project's.
  - package-ecosystem: github-actions
    directory: "/"
    exclude-paths:
      - ".github/workflows/auto*.yml"
      - ".github/workflows/build-*.yml"
      - ".github/workflows/calm-*.yml"
      - ".github/workflows/cli-*.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/docker-*.yml"
      - ".github/workflows/license-*.yml"
      - ".github/workflows/osv-*.yml"
      - ".github/workflows/pr-*.yml"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/s3-*.yml"
      - ".github/workflows/semgrep-*.yml"
      - ".github/workflows/validate-*.yml"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  # The package's own tree (pyproject.toml + uv.lock): linkml-runtime at
  # runtime and the LinkML toolchain for development. main.yaml is
  # the gate that has to stay green.
  - package-ecosystem: uv
    directory: "/.linkml"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns:
          - "*"

  # The .lokf/ sidecar's toolchain (the `lokf` package), kept apart from the
  # package tree: it maintains the knowledge bundle and has nothing to do
  # with the schema. A major bump can require concept frontmatter changes,
  # so these want a human read, not a rubber stamp.
  - package-ecosystem: uv
    directory: "/.lokf"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(lokf)"

  # The knowledge website's packages (website/package.json + package-lock.json).
  # A bump makes the lock differ from the ktl-website template; that is expected.
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(website)"
    groups:
      website:
        patterns:
          - "*"

  # The release job's tools, which .github/release/package-lock.json pins
  # with every package they pull in.
  - package-ecosystem: npm
    directory: "/.github/release"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(release)"
    groups:
      release-tools:
        patterns:
          - "*"

  # FINOS's manifests. FINOS's tree stays byte for byte as FINOS writes it,
  # so a Dependabot pull request on it can only fail the build: FINOS fixes
  # its own dependencies, and the next FINOS merge brings the fix here. An
  # `ignore` of every dependency stops security updates as well as version
  # updates; `open-pull-requests-limit: 0` stops version updates only. "/"
  # covers the npm workspaces the root package.json names.
  # tests/test_upstream.py holds both lists to FINOS's tree.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/calm-studio"
      - "/cli/test_fixtures/getting-started/STEP-2/website"
      - "/cli/test_fixtures/getting-started/STEP-3/website"
      - "/conferences/qcon"
      - "/shared/src/docify/template-bundles/docusaurus"
      - "/shared/test_fixtures/docify/workshop/expected-output/non-secure"
      - "/shared/test_fixtures/docify/workshop/expected-output/secure"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: maven
    directories:
      - "/"
      - "/calm"
      - "/calm-hub"
      - "/calm-models"
      - "/cli"
      - "/docs"
      - "/shared"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
