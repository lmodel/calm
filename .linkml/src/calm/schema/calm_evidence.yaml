---
id: https://w3id.org/lmodel/calm/calm_evidence
name: calm_evidence
title: Common Architecture Language Model Evidence
description: >-
  Schema for defining evidence for control requirements within the Common
  Architecture Language Model.
version: '1.3'
source: https://github.com/finos/calm-schema/blob/47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d/schema/evidence.json
license: Apache-2.0
see_also:
  - https://lmodel.github.io/calm
  - https://calm.finos.org/release/1.3/meta/evidence.json
comments:
  - >-
    Renders evidence.json of CALM 1.3, in CALM's own words wherever CALM gives a
    title or a description.

prefixes:
  calm: https://w3id.org/lmodel/calm/
  calm_meta: https://calm.finos.org/release/1.3/meta/
  linkml: https://w3id.org/linkml/
default_prefix: calm
default_range: string

imports:
  - linkml:types

classes:

  CalmEvidenceDocument:
    description: An evidence document, which holds one piece of evidence for a control.
    exact_mappings:
      - calm_meta:evidence.json
    extra_slots:
      allowed: true
    attributes:
      evidence:
        description: The evidence this document holds.
        range: CalmEvidence
        inlined: true
        required: true

  CalmEvidence:
    description: Evidence that a control's configuration is met, by the paths where it is kept.
    extra_slots:
      allowed: true
    attributes:
      unique_id:
        alias: unique-id
        description: CALM unique-id for future linking and uniquely defining this evidence
        required: true
      evidence_paths:
        alias: evidence-paths
        description: Paths to the evidence relating to a specific control
        multivalued: true
        required: true
      control_config_url:
        alias: control-config-url
        description: URI for the control configuration this evidence relates to
        required: true
