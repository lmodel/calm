---
id: https://w3id.org/lmodel/calm/calm_flow
name: calm_flow
title: Business Flow Model
description: >-
  Defines business flows that relate to technical architectures, allowing mapping
  of flows to technical components and attaching control requirements.
version: '1.3'
source: https://github.com/finos/calm-schema/blob/47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d/schema/flow.json
license: Apache-2.0
see_also:
  - https://lmodel.github.io/calm
  - https://calm.finos.org/release/1.3/meta/flow.json
comments:
  - >-
    Renders flow.json of CALM 1.3. Its title and description, and every
    description CALM gives an element, are CALM's own words; the others are this
    project's.

prefixes:
  calm: https://w3id.org/lmodel/calm/
  calm_meta: https://calm.finos.org/release/1.3/meta/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: calm
default_range: string

imports:
  - linkml:types
  - calm_control
  - calm_core

classes:

  CalmFlow:
    description: A business flow, as an ordered list of transitions across the architecture's relationships.
    exact_mappings:
      - calm_meta:flow.json#/defs/flow
    attributes:
      unique_id:
        alias: unique-id
        description: Unique identifier for the flow
        required: true
      name:
        description: Descriptive name for the business flow
        slot_uri: schema:name
        required: true
      description:
        description: Detailed description of the flow's purpose
        slot_uri: schema:description
        required: true
      requirement_url:
        alias: requirement-url
        description: Link to a detailed requirement document
      transitions:
        description: The steps of the flow, each across one relationship.
        range: CalmTransition
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        required: true
      controls:
        description: The controls that apply to this flow.
        range: CalmControls
        inlined: true
      metadata:
        description: Free-form metadata about this flow.
        range: CalmMetadata

  CalmTransition:
    description: One step of a flow, across one relationship of the architecture.
    exact_mappings:
      - calm_meta:flow.json#/defs/transition
    extra_slots:
      allowed: true
    attributes:
      relationship_unique_id:
        alias: relationship-unique-id
        description: Unique identifier for the relationship in the architecture
        required: true
      sequence_number:
        alias: sequence-number
        description: Indicates the sequence of the relationship in the flow
        range: integer
        required: true
      description:
        description: Functional summary of what is happening in the transition
        slot_uri: schema:description
        required: true
      direction:
        description: Which way along the relationship the step goes.
        range: CalmTransitionDirection
        ifabsent: string(source-to-destination)

enums:

  CalmTransitionDirection:
    description: The direction of a transition along its relationship.
    permissible_values:
      source-to-destination:
        title: source to destination
        description: From the relationship's source to its destination.
      destination-to-source:
        title: destination to source
        description: From the relationship's destination back to its source.
