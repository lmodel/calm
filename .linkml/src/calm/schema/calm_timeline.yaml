---
id: https://w3id.org/lmodel/calm/calm_timeline
name: calm_timeline
title: Common Architecture Language Model (CALM) Timelines Vocab
description: >-
  A timeline of an architecture: the moments at which it changed, each a node that
  points to the architecture of that moment.
version: '1.3'
source: https://github.com/finos/calm-schema/blob/47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d/schema/timeline.json
license: Apache-2.0
see_also:
  - https://lmodel.github.io/calm
  - https://calm.finos.org/release/1.3/meta/timeline.json
comments:
  - >-
    Renders timeline.json of CALM 1.3, in CALM's own words wherever CALM gives a
    title or a description. CALM gives the file no description, so the module's is
    this project's.

prefixes:
  calm: https://w3id.org/lmodel/calm/
  calm_meta: https://calm.finos.org/release/1.3/meta/
  linkml: https://w3id.org/linkml/
default_prefix: calm
default_range: string

imports:
  - linkml:types
  - calm_core

classes:

  CalmTimeline:
    description: A timeline document, listing the moments of an architecture and naming the current one.
    exact_mappings:
      - calm_meta:timeline.json
    extra_slots:
      allowed: true
    attributes:
      current_moment:
        alias: current-moment
        description: The unique-id of the current architecture moment within the timeline.
      moments:
        description: >-
          A list of significant architecture states or points in time, each
          represented as a 'moment'.
        range: CalmNodeMoment
        multivalued: true
        inlined_as_list: true
        required: true
      metadata:
        description: Free-form metadata about this timeline.
        range: CalmMetadata

  CalmNodeMoment:
    is_a: CalmNode
    description: >-
      A moment of a timeline: a node of type moment, with no interfaces, whose
      details point to the architecture of that moment.
    exact_mappings:
      - calm_meta:timeline.json#/defs/node-moment
    extra_slots:
      allowed: true
    comments:
      - >-
        The three conditions on inherited slots are class rules, not slot_usage,
        because gen-shacl refuses equals_string on a slot that also has any_of.
    all_of:
      - slot_conditions:
          node_type:
            equals_string: moment
      - slot_conditions:
          details:
            value_presence: PRESENT
      - slot_conditions:
          interfaces:
            value_presence: ABSENT
    attributes:
      valid_from:
        alias: valid-from
        description: The date when this architecture moment came into effect.
        range: date
      adrs:
        description: >-
          External links to ADRs (Architecture Decision Records) or similar
          documents that provide context or decisions related to why the
          architecture changed.
        multivalued: true
