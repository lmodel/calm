---
id: https://w3id.org/lmodel/calm/calm_control_requirement
name: calm_control_requirement
title: Common Architecture Language Model Control Requirement
description: >-
  Schema for defining control requirements within the Common Architecture
  Language Model.
version: '1.3'
source: https://github.com/finos/calm-schema/blob/47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d/schema/control-requirement.json
license: Apache-2.0
see_also:
  - https://lmodel.github.io/calm
  - https://calm.finos.org/release/1.3/meta/control-requirement.json
comments:
  - >-
    Renders control-requirement.json of CALM 1.3, in CALM's own words wherever CALM
    gives a title or a description.

prefixes:
  calm: https://w3id.org/lmodel/calm/
  calm_meta: https://calm.finos.org/release/1.3/meta/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: calm
default_range: string

imports:
  - linkml:types

classes:

  CalmControlRequirement:
    description: >-
      A control requirement: what a control must achieve, which a control detail's
      requirement-url points to.
    exact_mappings:
      - calm_meta:control-requirement.json
    extra_slots:
      allowed: true
    examples:
      - object:
          control-id: CR-001
          name: Access Control
          description: Ensure that access to sensitive information is restricted.
    attributes:
      control_id:
        alias: control-id
        description: >-
          The unique identifier of this control, which has the potential to be
          used for linking evidence
        required: true
      name:
        description: >-
          The name of the control requirement that provides contextual meaning
          within a given domain
        slot_uri: schema:name
        required: true
      description:
        description: >-
          A more detailed description of the control and information on what a
          developer needs to consider
        slot_uri: schema:description
        required: true
