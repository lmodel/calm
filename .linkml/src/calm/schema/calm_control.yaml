---
id: https://w3id.org/lmodel/calm/calm_control
name: calm_control
title: Common Architecture Language Model Controls
description: >-
  Controls model requirements for domains. For example, a security domain contains
  a series of control requirements
version: '1.3'
source: https://github.com/finos/calm-schema/blob/47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d/schema/control.json
license: Apache-2.0
see_also:
  - https://lmodel.github.io/calm
  - https://calm.finos.org/release/1.3/meta/control.json
comments:
  - >-
    Renders control.json of CALM 1.3. Its title and description, and every
    description CALM gives an element, are CALM's own words; the others are this
    project's.

prefixes:
  calm: https://w3id.org/lmodel/calm/
  calm_meta: https://calm.finos.org/release/1.3/meta/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: calm
default_range: string

imports:
  - linkml:types

classes:

  CalmControls:
    description: >-
      The controls that apply to an architecture element, each under a key of
      letters, digits and hyphens.
    comments:
      - >-
        CALM states the key pattern with patternProperties, which LinkML cannot
        state, so any key is accepted here. CALM itself leaves a key outside the
        pattern unchecked.
    exact_mappings:
      - calm_meta:control.json#/defs/controls
    extra_slots:
      range_expression:
        range: CalmControl

  CalmControl:
    description: One control in a controls map, with the requirements that define it.
    extra_slots:
      allowed: true
    attributes:
      description:
        description: A description of a control and how it applies to a given architecture
        slot_uri: schema:description
        required: true
      requirements:
        description: The requirements this control applies, each with its configuration.
        range: CalmControlDetail
        multivalued: true
        inlined_as_list: true
        required: true

  CalmControlDetail:
    description: >-
      A control requirement this control applies, with its configuration given by
      address or inline, but not both.
    exact_mappings:
      - calm_meta:control.json#/defs/control-detail
    extra_slots:
      allowed: true
    exactly_one_of:
      - slot_conditions:
          config_url:
            value_presence: PRESENT
      - slot_conditions:
          config:
            value_presence: PRESENT
    attributes:
      requirement_url:
        alias: requirement-url
        description: The requirement schema that specifies how a control should be defined
        required: true
      config_url:
        alias: config-url
        description: The configuration of how the control requirement schema is met
      config:
        description: Inline configuration of how the control requirement schema is met
        range: CalmControlConfig
        inlined: true

  CalmControlConfig:
    description: A configuration object, free in shape, that meets a control requirement.
    extra_slots:
      allowed: true
