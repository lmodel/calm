---
id: https://w3id.org/lmodel/calm
name: calm
title: FINOS CALM
description: >-
  A LinkML model of CALM 1.3, the Common Architecture Language Model of FINOS's
  Architecture as Code project. Each module renders one file of the CALM Meta
  Schema and keeps CALM's keys, so a CALM document validates here unchanged, and
  CALM's JSON Schema files can be generated from the model.
version: '1.3'
source: https://github.com/finos/calm-schema/tree/47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d/schema
license: Apache-2.0
keywords:
  - architecture as code
  - software architecture
  - CALM
  - FINOS
see_also:
  - https://lmodel.github.io/calm
  - https://calm.finos.org/
  - https://github.com/finos/calm-schema
annotations:
  upstream_tag: v1.3
  upstream_commit: 47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d
  upstream_release_date: '2026-10-24'
  upstream_license: Apache-2.0
comments:
  - >-
    A slot whose name differs from CALM's key carries the key as its alias, such
    as unique_id for unique-id. scripts/calm_meta.py writes CALM's files with the
    aliases as keys, which plain gen-json-schema does only with --preserve-names.
  - >-
    Six slots list CALM's key under aliases instead, so that only CALM's files
    carry it. Five are source_end, destination_end, target_architectures,
    unit_of_time and decorator_type, because LOKF defines source, target, unit
    and type with other meanings, and a composite's JSON-LD context gives each
    key one IRI. The sixth, decorator_schema, holds $schema, which gen-python
    would make an attribute's name.
  - >-
    A reference to a node, relationship or moment is its unique-id, a string, as
    CALM gives it. No slot is an identifier: gen-python in linkml 1.12.1 names an
    identifier's type from its alias, and the hyphen in unique-id makes that name
    invalid Python.
  - >-
    calm.json and calm-timeline.json declare CALM's vocabulary beside JSON
    Schema's own and hold no definition, so no module renders them; the build
    copies them from upstream/.

prefixes:
  calm: https://w3id.org/lmodel/calm/
  calm_meta: https://calm.finos.org/release/1.3/meta/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: calm
default_range: string

imports:
  - linkml:types
  - calm_control
  - calm_interface
  - calm_core
  - calm_flow
  - calm_timeline
  - calm_decorators
  - calm_evidence
  - calm_control_requirement
  - calm_units

classes:

  CalmArchitecture:
    description: >-
      A CALM architecture document: the nodes of a system, the relationships
      between them, its business flows, and the controls that apply to it.
    comments:
      - >-
        An architecture is itself a JSON Schema document, so it may carry JSON
        Schema's keys, such as $schema, beside CALM's own.
    exact_mappings:
      - calm_meta:core.json
    tree_root: true
    extra_slots:
      allowed: true
    attributes:
      nodes:
        description: The components of the architecture.
        range: CalmNode
        multivalued: true
        inlined_as_list: true
      relationships:
        description: The links between the architecture's nodes.
        range: CalmRelationship
        multivalued: true
        inlined_as_list: true
      metadata:
        description: Free-form metadata about the architecture.
        range: CalmMetadata
      controls:
        description: The controls that apply to the whole architecture.
        range: CalmControls
        inlined: true
      flows:
        description: The business flows that run across the architecture.
        range: CalmFlow
        multivalued: true
        inlined_as_list: true
      adrs:
        description: >-
          External links to ADRs (Architecture Decision Records) or similar
          documents that provide context or decisions related to the architecture.
          These can be URLs or references to internal documentation.
        multivalued: true
