    "CalmCronExpression": {
      "name": "CalmCronExpression",
      "description": "A valid Unix-style cron expression.",
      "title": "Cron Expression",
      "comments": [
        "CALM's pattern accepts only numbers, so it refuses all three of CALM's own examples, each of which holds an asterisk. The build copies the examples as CALM gives them, and tests/test_parity.py records the fault."
      ],
      "examples": [
        {
          "value": "0 0 * * 0"
        },
        {
          "value": "30 14 1 * 5"
        },
        {
          "value": "15 10 * * *"
        }
      ],
      "from_schema": "https://w3id.org/lmodel/calm",
      "exact_mappings": [
        "calm_meta:units.json#/defs/cron-expression"
      ],
      "typeof": "string",
      "pattern": "^([0-5]?\\d)\\s([01]?\\d|2[0-3])\\s(3[01]|[12]\\d|0?[1-9])\\s(1[0-2]|0?[1-9])\\s([0-6])$"
    }
  },
