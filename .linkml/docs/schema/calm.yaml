    owner: CalmControlRequirement
    domain_of:
    - CalmControlRequirement
    range: string
    required: true
  calmControlRequirement__description:
    name: calmControlRequirement__description
    description: A more detailed description of the control and information on what
      a developer needs to consider
    from_schema: https://w3id.org/lmodel/calm/calm_control_requirement
    mappings:
    - schema:description
    slot_uri: schema:description
    alias: description
    owner: CalmControlRequirement
    domain_of:
    - CalmControlRequirement
    range: string
    required: true
  calmTimeUnit__unit_of_time:
    name: calmTimeUnit__unit_of_time
    description: The unit of time (e.g., seconds, minutes, hours).
    from_schema: https://w3id.org/lmodel/calm/calm_units
    aliases:
    - unit
    slot_uri: calm:unit_of_time
    alias: unit_of_time
    owner: CalmTimeUnit
    domain_of:
    - CalmTimeUnit
    range: CalmTimeUnitName
    required: true
  calmTimeUnit__value:
    name: calmTimeUnit__value
    description: The numeric value representing the amount of time.
    from_schema: https://w3id.org/lmodel/calm/calm_units
    slot_uri: calm:value
    alias: value
    owner: CalmTimeUnit
    domain_of:
    - CalmTimeUnit
    range: float
    required: true
    minimum_value: 0
  calmRateUnit__rate:
    name: calmRateUnit__rate
    description: The numeric value representing the rate.
    from_schema: https://w3id.org/lmodel/calm/calm_units
    slot_uri: calm:rate
    alias: rate
    owner: CalmRateUnit
    domain_of:
    - CalmRateUnit
    range: float
    required: true
    minimum_value: 0
  calmRateUnit__per:
    name: calmRateUnit__per
    description: The time unit defining the rate interval.
    from_schema: https://w3id.org/lmodel/calm/calm_units
    slot_uri: calm:per
    alias: per
    owner: CalmRateUnit
    domain_of:
    - CalmRateUnit
    range: CalmRateInterval
    required: true
classes:
  CalmArchitecture:
    name: CalmArchitecture
    definition_uri: https://w3id.org/lmodel/calm/CalmArchitecture
    description: 'A CALM architecture document: the nodes of a system, the relationships
      between them, its business flows, and the controls that apply to it.'
    comments:
    - An architecture is itself a JSON Schema document, so it may carry JSON Schema's
      keys, such as $schema, beside CALM's own.
    from_schema: https://w3id.org/lmodel/calm
    exact_mappings:
    - calm_meta:core.json
    slots:
    - calmArchitecture__nodes
    - calmArchitecture__relationships
    - calmArchitecture__metadata
    - calmArchitecture__controls
    - calmArchitecture__flows
    - calmArchitecture__adrs
    attributes:
      nodes:
        name: nodes
        description: The components of the architecture.
        range: CalmNode
        multivalued: true
        inlined_as_list: true
      relationships:
        name: relationships
        description: The links between the architecture's nodes.
        range: CalmRelationship
        multivalued: true
        inlined_as_list: true
      metadata:
        name: metadata
        description: Free-form metadata about the architecture.
        range: CalmMetadata
      controls:
        name: controls
        description: The controls that apply to the whole architecture.
        range: CalmControls
        inlined: true
      flows:
        name: flows
        description: The business flows that run across the architecture.
        range: CalmFlow
        multivalued: true
        inlined_as_list: true
      adrs:
        name: adrs
        description: External links to ADRs (Architecture Decision Records) or similar
          documents that provide context or decisions related to the architecture.
          These can be URLs or references to internal documentation.
        multivalued: true
    class_uri: calm:CalmArchitecture
    tree_root: true
    extra_slots:
      allowed: true
  CalmControls:
    name: CalmControls
    definition_uri: https://w3id.org/lmodel/calm/CalmControls
    description: The controls that apply to an architecture element, each under a
      key of letters, digits and hyphens.
    comments:
    - CALM states the key pattern with patternProperties, which LinkML cannot state,
      so any key is accepted here. CALM itself leaves a key outside the pattern unchecked.
    from_schema: https://w3id.org/lmodel/calm/calm_control
    exact_mappings:
    - calm_meta:control.json#/defs/controls
    class_uri: calm:CalmControls
    extra_slots:
      range_expression:
        range: CalmControl
  CalmControl:
    name: CalmControl
    definition_uri: https://w3id.org/lmodel/calm/CalmControl
    description: One control in a controls map, with the requirements that define
      it.
    from_schema: https://w3id.org/lmodel/calm/calm_control
    slots:
    - calmControl__description
    - calmControl__requirements
    attributes:
      description:
        name: description
        description: A description of a control and how it applies to a given architecture
        slot_uri: schema:description
        required: true
      requirements:
        name: requirements
        description: The requirements this control applies, each with its configuration.
        range: CalmControlDetail
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: calm:CalmControl
    extra_slots:
      allowed: true
  CalmControlDetail:
    name: CalmControlDetail
    definition_uri: https://w3id.org/lmodel/calm/CalmControlDetail
    description: A control requirement this control applies, with its configuration
      given by address or inline, but not both.
    from_schema: https://w3id.org/lmodel/calm/calm_control
    exact_mappings:
    - calm_meta:control.json#/defs/control-detail
    slots:
    - calmControlDetail__requirement_url
    - calmControlDetail__config_url
    - calmControlDetail__config
    attributes:
      requirement_url:
        name: requirement_url
        description: The requirement schema that specifies how a control should be
          defined
        alias: requirement-url
        required: true
      config_url:
        name: config_url
        description: The configuration of how the control requirement schema is met
        alias: config-url
      config:
        name: config
        description: Inline configuration of how the control requirement schema is
          met
        range: CalmControlConfig
        inlined: true
    class_uri: calm:CalmControlDetail
    extra_slots:
      allowed: true
    exactly_one_of:
    - slot_conditions:
        config_url:
          name: config_url
          value_presence: PRESENT
    - slot_conditions:
        config:
          name: config
          value_presence: PRESENT
  CalmControlConfig:
    name: CalmControlConfig
    definition_uri: https://w3id.org/lmodel/calm/CalmControlConfig
    description: A configuration object, free in shape, that meets a control requirement.
    from_schema: https://w3id.org/lmodel/calm/calm_control
    class_uri: calm:CalmControlConfig
    extra_slots:
      allowed: true
  CalmInterfaceDefinition:
    name: CalmInterfaceDefinition
    definition_uri: https://w3id.org/lmodel/calm/CalmInterfaceDefinition
    description: A modular interface definition referencing an external schema
    from_schema: https://w3id.org/lmodel/calm/calm_interface
    exact_mappings:
    - calm_meta:interface.json#/defs/interface-definition
    slots:
    - calmInterfaceDefinition__unique_id
    - calmInterfaceDefinition__definition_url
    - calmInterfaceDefinition__config
    attributes:
      unique_id:
        name: unique_id
        description: Unique identifier for this interface instance
        alias: unique-id
        required: true
      definition_url:
        name: definition_url
        description: URI of the external schema this interface configuration conforms
          to
        alias: definition-url
        required: true
      config:
        name: config
        description: Inline configuration conforming to the external interface schema
        range: CalmInterfaceConfig
        required: true
        inlined: true
    class_uri: calm:CalmInterfaceDefinition
  CalmInterfaceConfig:
    name: CalmInterfaceConfig
    definition_uri: https://w3id.org/lmodel/calm/CalmInterfaceConfig
    description: A configuration object, free in shape, that an interface definition's
      schema checks.
    from_schema: https://w3id.org/lmodel/calm/calm_interface
    class_uri: calm:CalmInterfaceConfig
    extra_slots:
      allowed: true
  CalmInterfaceType:
    name: CalmInterfaceType
    definition_uri: https://w3id.org/lmodel/calm/CalmInterfaceType
    description: An interface given by its own keys, such as a host and port, rather
      than by an external schema.
    from_schema: https://w3id.org/lmodel/calm/calm_interface
    exact_mappings:
    - calm_meta:interface.json#/defs/interface-type
    slots:
    - calmInterfaceType__unique_id
    attributes:
      unique_id:
        name: unique_id
        description: The interface's identifier, unique within the architecture.
        alias: unique-id
        required: true
    class_uri: calm:CalmInterfaceType
    extra_slots:
      allowed: true
  CalmNodeInterface:
    name: CalmNodeInterface
    definition_uri: https://w3id.org/lmodel/calm/CalmNodeInterface
    description: One end of a connection, naming a node and, optionally, which of
      its interfaces.
    from_schema: https://w3id.org/lmodel/calm/calm_interface
    exact_mappings:
    - calm_meta:interface.json#/defs/node-interface
    slots:
    - calmNodeInterface__node
    - calmNodeInterface__interfaces
    attributes:
      node:
        name: node
        description: The unique-id of the node at this end.
        required: true
      interfaces:
        name: interfaces
        description: The unique-ids of the node's interfaces this end uses.
        multivalued: true
    class_uri: calm:CalmNodeInterface
    extra_slots:
      allowed: true
  CalmNode:
    name: CalmNode
    definition_uri: https://w3id.org/lmodel/calm/CalmNode
    description: A component of the architecture, such as a system, service, database
      or actor, with its interfaces and controls.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    exact_mappings:
    - calm_meta:core.json#/defs/node
    slots:
    - calmNode__unique_id
    - calmNode__node_type
    - calmNode__name
    - calmNode__description
    - calmNode__details
    - calmNode__interfaces
    - calmNode__controls
    - calmNode__metadata
    attributes:
      unique_id:
        name: unique_id
        description: The node's identifier, unique within the architecture.
        alias: unique-id
        required: true
      node_type:
        name: node_type
        description: What kind of node this is, one of CALM's built-in types or any
          other name.
        alias: node-type
        required: true
        any_of:
        - range: CalmNodeTypeDefinition
        - range: string
      name:
        name: name
        description: The node's name.
        slot_uri: schema:name
        required: true
      description:
        name: description
        description: What the node is and does.
        slot_uri: schema:description
        required: true
      details:
        name: details
        description: Where a more detailed architecture of this node is, and the pattern
          it must follow.
        range: CalmNodeDetails
        inlined: true
      interfaces:
        name: interfaces
        description: The interfaces the node exposes.
        multivalued: true
        inlined_as_list: true
        any_of:
        - range: CalmInterfaceDefinition
          inlined: true
        - range: CalmInterfaceType
          inlined: true
      controls:
        name: controls
        description: The controls that apply to this node.
        range: CalmControls
        inlined: true
      metadata:
        name: metadata
        description: Free-form metadata about this node.
        range: CalmMetadata
    class_uri: calm:CalmNode
    extra_slots:
      allowed: true
  CalmNodeDetails:
    name: CalmNodeDetails
    definition_uri: https://w3id.org/lmodel/calm/CalmNodeDetails
    description: References from a node to a more detailed architecture and to the
      pattern it must follow.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    slots:
    - calmNodeDetails__detailed_architecture
    - calmNodeDetails__required_pattern
    attributes:
      detailed_architecture:
        name: detailed_architecture
        description: The address of an architecture document that describes this node
          in detail.
        alias: detailed-architecture
      required_pattern:
        name: required_pattern
        description: The address of a pattern that the detailed architecture must
          follow.
        alias: required-pattern
    class_uri: calm:CalmNodeDetails
  CalmRelationship:
    name: CalmRelationship
    definition_uri: https://w3id.org/lmodel/calm/CalmRelationship
    description: A link between nodes, of one of CALM's kinds, or a choice between
      options.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    exact_mappings:
    - calm_meta:core.json#/defs/relationship
    slots:
    - calmRelationship__unique_id
    - calmRelationship__description
    - calmRelationship__relationship_type
    - calmRelationship__protocol
    - calmRelationship__metadata
    - calmRelationship__controls
    attributes:
      unique_id:
        name: unique_id
        description: The relationship's identifier, unique within the architecture.
        alias: unique-id
        required: true
      description:
        name: description
        description: What the relationship is for.
        slot_uri: schema:description
      relationship_type:
        name: relationship_type
        description: The kind of the relationship and the nodes it links.
        alias: relationship-type
        range: CalmRelationshipType
        required: true
        inlined: true
      protocol:
        name: protocol
        description: The protocol a connection uses.
        range: CalmProtocol
      metadata:
        name: metadata
        description: Free-form metadata about this relationship.
        range: CalmMetadata
      controls:
        name: controls
        description: The controls that apply to this relationship.
        range: CalmControls
        inlined: true
    class_uri: calm:CalmRelationship
    extra_slots:
      allowed: true
  CalmRelationshipType:
    name: CalmRelationshipType
    definition_uri: https://w3id.org/lmodel/calm/CalmRelationshipType
    description: 'The kind of a relationship, given by exactly one of its keys: interacts,
      connects, deployed-in, composed-of or options.'
    from_schema: https://w3id.org/lmodel/calm/calm_core
    slots:
    - calmRelationshipType__interacts
    - calmRelationshipType__connects
    - calmRelationshipType__deployed_in
    - calmRelationshipType__composed_of
    - calmRelationshipType__options
    attributes:
      interacts:
        name: interacts
        description: An actor that interacts with nodes.
        range: CalmInteractsType
        inlined: true
      connects:
        name: connects
        description: A connection from one node's interfaces to another's.
        range: CalmConnectsType
        inlined: true
      deployed_in:
        name: deployed_in
        description: Nodes deployed in a container node.
        alias: deployed-in
        range: CalmDeployedInType
        inlined: true
      composed_of:
        name: composed_of
        description: Nodes that make up a container node.
        alias: composed-of
        range: CalmComposedOfType
        inlined: true
      options:
        name: options
        description: Decisions between options, each naming the nodes and relationships
          it would add.
        range: CalmDecision
        multivalued: true
        inlined_as_list: true
    class_uri: calm:CalmRelationshipType
    extra_slots:
      allowed: true
    exactly_one_of:
    - slot_conditions:
        deployed_in:
          name: deployed_in
          value_presence: PRESENT
    - slot_conditions:
        composed_of:
          name: composed_of
          value_presence: PRESENT
    - slot_conditions:
        interacts:
          name: interacts
          value_presence: PRESENT
    - slot_conditions:
        connects:
          name: connects
          value_presence: PRESENT
    - slot_conditions:
        options:
          name: options
          value_presence: PRESENT
  CalmInteractsType:
    name: CalmInteractsType
    definition_uri: https://w3id.org/lmodel/calm/CalmInteractsType
    description: A relationship in which an actor interacts with nodes.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    exact_mappings:
    - calm_meta:core.json#/defs/interacts-type
    slots:
    - calmInteractsType__actor
    - calmInteractsType__nodes
    attributes:
      actor:
        name: actor
        description: The unique-id of the node that acts.
        required: true
      nodes:
        name: nodes
        description: The unique-ids of the nodes it interacts with.
        required: true
        multivalued: true
        minimum_cardinality: 1
    class_uri: calm:CalmInteractsType
    extra_slots:
      allowed: true
  CalmConnectsType:
    name: CalmConnectsType
    definition_uri: https://w3id.org/lmodel/calm/CalmConnectsType
    description: A relationship in which one node connects to another through their
      interfaces.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    exact_mappings:
    - calm_meta:core.json#/defs/connects-type
    slots:
    - calmConnectsType__source_end
    - calmConnectsType__destination_end
    attributes:
      source_end:
        name: source_end
        description: The end that opens the connection.
        aliases:
        - source
        range: CalmNodeInterface
        required: true
        inlined: true
      destination_end:
        name: destination_end
        description: The end the connection reaches.
        aliases:
        - destination
        range: CalmNodeInterface
        required: true
        inlined: true
    class_uri: calm:CalmConnectsType
    extra_slots:
      allowed: true
  CalmDeployedInType:
    name: CalmDeployedInType
    definition_uri: https://w3id.org/lmodel/calm/CalmDeployedInType
    description: A relationship in which nodes are deployed in a container node.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    exact_mappings:
    - calm_meta:core.json#/defs/deployed-in-type
    slots:
    - calmDeployedInType__container
    - calmDeployedInType__nodes
    attributes:
      container:
        name: container
        description: The unique-id of the node the others are deployed in.
        required: true
      nodes:
        name: nodes
        description: The unique-ids of the deployed nodes.
        required: true
        multivalued: true
        minimum_cardinality: 1
    class_uri: calm:CalmDeployedInType
    extra_slots:
      allowed: true
  CalmComposedOfType:
    name: CalmComposedOfType
    definition_uri: https://w3id.org/lmodel/calm/CalmComposedOfType
    description: A relationship in which nodes make up a container node.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    exact_mappings:
    - calm_meta:core.json#/defs/composed-of-type
    slots:
    - calmComposedOfType__container
    - calmComposedOfType__nodes
    attributes:
      container:
        name: container
        description: The unique-id of the node the others make up.
        required: true
      nodes:
        name: nodes
        description: The unique-ids of the nodes it is made of.
        required: true
        multivalued: true
        minimum_cardinality: 1
    class_uri: calm:CalmComposedOfType
    extra_slots:
      allowed: true
  CalmDecision:
    name: CalmDecision
    definition_uri: https://w3id.org/lmodel/calm/CalmDecision
    description: One option of a choice, naming the nodes, relationships and controls
      it would add.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    exact_mappings:
    - calm_meta:core.json#/defs/decision
    slots:
    - calmDecision__description
    - calmDecision__nodes
    - calmDecision__relationships
    - calmDecision__controls
    attributes:
      description:
        name: description
        description: What choosing this option means.
        slot_uri: schema:description
        required: true
      nodes:
        name: nodes
        description: The unique-ids of the nodes this option adds.
        required: true
        multivalued: true
      relationships:
        name: relationships
        description: The unique-ids of the relationships this option adds.
        required: true
        multivalued: true
      controls:
        name: controls
        description: The keys of the controls this option adds.
        multivalued: true
    class_uri: calm:CalmDecision
    extra_slots:
      allowed: true
  CalmMetadata:
    name: CalmMetadata
    definition_uri: https://w3id.org/lmodel/calm/CalmMetadata
    description: Free-form metadata, as an object or a list of objects.
    comments:
    - LinkML cannot state "an object, or a list of objects", so the class takes any
      value, and the build writes it as a schema that accepts any value.
    from_schema: https://w3id.org/lmodel/calm/calm_core
    exact_mappings:
    - linkml:Any
    - calm_meta:core.json#/defs/metadata
    class_uri: linkml:Any
  CalmFlow:
    name: CalmFlow
    definition_uri: https://w3id.org/lmodel/calm/CalmFlow
    description: A business flow, as an ordered list of transitions across the architecture's
      relationships.
    from_schema: https://w3id.org/lmodel/calm/calm_flow
    exact_mappings:
    - calm_meta:flow.json#/defs/flow
    slots:
    - calmFlow__unique_id
    - calmFlow__name
    - calmFlow__description
    - calmFlow__requirement_url
    - calmFlow__transitions
    - calmFlow__controls
    - calmFlow__metadata
    attributes:
      unique_id:
        name: unique_id
        description: Unique identifier for the flow
        alias: unique-id
        required: true
      name:
        name: name
        description: Descriptive name for the business flow
        slot_uri: schema:name
        required: true
      description:
        name: description
        description: Detailed description of the flow's purpose
        slot_uri: schema:description
        required: true
      requirement_url:
        name: requirement_url
        description: Link to a detailed requirement document
        alias: requirement-url
      transitions:
        name: transitions
        description: The steps of the flow, each across one relationship.
        range: CalmTransition
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      controls:
        name: controls
        description: The controls that apply to this flow.
        range: CalmControls
        inlined: true
      metadata:
        name: metadata
        description: Free-form metadata about this flow.
        range: CalmMetadata
    class_uri: calm:CalmFlow
  CalmTransition:
    name: CalmTransition
    definition_uri: https://w3id.org/lmodel/calm/CalmTransition
    description: One step of a flow, across one relationship of the architecture.
    from_schema: https://w3id.org/lmodel/calm/calm_flow
    exact_mappings:
    - calm_meta:flow.json#/defs/transition
    slots:
    - calmTransition__relationship_unique_id
    - calmTransition__sequence_number
    - calmTransition__description
    - calmTransition__direction
    attributes:
      relationship_unique_id:
        name: relationship_unique_id
        description: Unique identifier for the relationship in the architecture
        alias: relationship-unique-id
        required: true
      sequence_number:
        name: sequence_number
        description: Indicates the sequence of the relationship in the flow
        alias: sequence-number
        range: integer
        required: true
      description:
        name: description
        description: Functional summary of what is happening in the transition
        slot_uri: schema:description
        required: true
      direction:
        name: direction
        description: Which way along the relationship the step goes.
        ifabsent: string(source-to-destination)
        range: CalmTransitionDirection
    class_uri: calm:CalmTransition
    extra_slots:
      allowed: true
  CalmTimeline:
    name: CalmTimeline
    definition_uri: https://w3id.org/lmodel/calm/CalmTimeline
    description: A timeline document, listing the moments of an architecture and naming
      the current one.
    from_schema: https://w3id.org/lmodel/calm/calm_timeline
    exact_mappings:
    - calm_meta:timeline.json
    slots:
    - calmTimeline__current_moment
    - calmTimeline__moments
    - calmTimeline__metadata
    attributes:
      current_moment:
        name: current_moment
        description: The unique-id of the current architecture moment within the timeline.
        alias: current-moment
      moments:
        name: moments
        description: A list of significant architecture states or points in time,
          each represented as a 'moment'.
        range: CalmNodeMoment
        required: true
        multivalued: true
        inlined_as_list: true
      metadata:
        name: metadata
        description: Free-form metadata about this timeline.
        range: CalmMetadata
    class_uri: calm:CalmTimeline
    extra_slots:
      allowed: true
  CalmNodeMoment:
    name: CalmNodeMoment
    definition_uri: https://w3id.org/lmodel/calm/CalmNodeMoment
    description: 'A moment of a timeline: a node of type moment, with no interfaces,
      whose details point to the architecture of that moment.'
    comments:
    - The three conditions on inherited slots are class rules, not slot_usage, because
      gen-shacl refuses equals_string on a slot that also has any_of.
    from_schema: https://w3id.org/lmodel/calm/calm_timeline
    exact_mappings:
    - calm_meta:timeline.json#/defs/node-moment
    is_a: CalmNode
    slots:
    - calmNode__unique_id
    - calmNode__node_type
    - calmNode__name
    - calmNode__description
    - calmNode__details
    - calmNode__interfaces
    - calmNode__controls
    - calmNode__metadata
    - calmNodeMoment__valid_from
    - calmNodeMoment__adrs
    attributes:
      valid_from:
        name: valid_from
        description: The date when this architecture moment came into effect.
        alias: valid-from
        range: date
      adrs:
        name: adrs
        description: External links to ADRs (Architecture Decision Records) or similar
          documents that provide context or decisions related to why the architecture
          changed.
        multivalued: true
    class_uri: calm:CalmNodeMoment
    extra_slots:
      allowed: true
    all_of:
    - slot_conditions:
        node_type:
          name: node_type
          equals_string: moment
    - slot_conditions:
        details:
          name: details
          value_presence: PRESENT
    - slot_conditions:
        interfaces:
          name: interfaces
          value_presence: ABSENT
  CalmDecorator:
    name: CalmDecorator
    definition_uri: https://w3id.org/lmodel/calm/CalmDecorator
    description: Supplementary information about elements of one or more architectures,
      kept apart from the architectures themselves.
    from_schema: https://w3id.org/lmodel/calm/calm_decorators
    exact_mappings:
    - calm_meta:decorators.json#/defs/decorator
    slots:
    - calmDecorator__decorator_schema
    - calmDecorator__unique_id
    - calmDecorator__decorator_type
    - calmDecorator__target_type
    - calmDecorator__target_architectures
    - calmDecorator__applies_to
    - calmDecorator__data
    attributes:
      decorator_schema:
        name: decorator_schema
        description: URI of the schema that this decorator conforms to, for example
          a decorator standard
        aliases:
        - $schema
      unique_id:
        name: unique_id
        description: Unique identifier for this decorator
        alias: unique-id
        required: true
      decorator_type:
        name: decorator_type
        description: Type of decorator - a free-form string identifying the decorator
          category
        aliases:
        - type
        required: true
      target_type:
        name: target_type
        description: Optional array of the types of CALM document that this decorator
          can target. The only type is architecture, because applies-to holds the
          unique-ids of architecture elements.
        list_elements_unique: true
        alias: target-type
        range: CalmDecoratorTargetType
        multivalued: true
        minimum_cardinality: 1
      target_architectures:
        name: target_architectures
        description: Array of file paths or URLs referencing the CALM architectures
          this decorator targets
        aliases:
        - target
        required: true
        multivalued: true
        minimum_cardinality: 1
      applies_to:
        name: applies_to
        description: Array of unique-ids referencing nodes, relationships, flows,
          or other architecture elements
        alias: applies-to
        required: true
        multivalued: true
        minimum_cardinality: 1
      data:
        name: data
        description: Free-form JSON object containing the decorator's data
        range: CalmDecoratorData
        required: true
        inlined: true
    class_uri: calm:CalmDecorator
  CalmDecoratorData:
    name: CalmDecoratorData
    definition_uri: https://w3id.org/lmodel/calm/CalmDecoratorData
    description: The decorator's data, an object free in shape.
    comments:
    - CALM requires at least one key, which LinkML cannot state, so an empty object
      is accepted here.
    from_schema: https://w3id.org/lmodel/calm/calm_decorators
    class_uri: calm:CalmDecoratorData
    extra_slots:
      allowed: true
  CalmEvidenceDocument:
    name: CalmEvidenceDocument
    definition_uri: https://w3id.org/lmodel/calm/CalmEvidenceDocument
    description: An evidence document, which holds one piece of evidence for a control.
    from_schema: https://w3id.org/lmodel/calm/calm_evidence
    exact_mappings:
    - calm_meta:evidence.json
    slots:
    - calmEvidenceDocument__evidence
    attributes:
      evidence:
        name: evidence
        description: The evidence this document holds.
        range: CalmEvidence
        required: true
        inlined: true
    class_uri: calm:CalmEvidenceDocument
    extra_slots:
      allowed: true
  CalmEvidence:
    name: CalmEvidence
    definition_uri: https://w3id.org/lmodel/calm/CalmEvidence
    description: Evidence that a control's configuration is met, by the paths where
      it is kept.
    from_schema: https://w3id.org/lmodel/calm/calm_evidence
    slots:
    - calmEvidence__unique_id
    - calmEvidence__evidence_paths
    - calmEvidence__control_config_url
    attributes:
      unique_id:
        name: unique_id
        description: CALM unique-id for future linking and uniquely defining this
          evidence
        alias: unique-id
        required: true
      evidence_paths:
        name: evidence_paths
        description: Paths to the evidence relating to a specific control
        alias: evidence-paths
        required: true
        multivalued: true
      control_config_url:
        name: control_config_url
        description: URI for the control configuration this evidence relates to
        alias: control-config-url
        required: true
    class_uri: calm:CalmEvidence
    extra_slots:
      allowed: true
  CalmControlRequirement:
    name: CalmControlRequirement
    definition_uri: https://w3id.org/lmodel/calm/CalmControlRequirement
    description: 'A control requirement: what a control must achieve, which a control
      detail''s requirement-url points to.'
    examples:
    - object:
        control-id: CR-001
        name: Access Control
        description: Ensure that access to sensitive information is restricted.
    from_schema: https://w3id.org/lmodel/calm/calm_control_requirement
    exact_mappings:
    - calm_meta:control-requirement.json
    slots:
    - calmControlRequirement__control_id
    - calmControlRequirement__name
    - calmControlRequirement__description
    attributes:
      control_id:
        name: control_id
        description: The unique identifier of this control, which has the potential
          to be used for linking evidence
        alias: control-id
        required: true
      name:
        name: name
        description: The name of the control requirement that provides contextual
          meaning within a given domain
        slot_uri: schema:name
        required: true
      description:
        name: description
        description: A more detailed description of the control and information on
          what a developer needs to consider
        slot_uri: schema:description
        required: true
    class_uri: calm:CalmControlRequirement
    extra_slots:
      allowed: true
  CalmTimeUnit:
    name: CalmTimeUnit
    definition_uri: https://w3id.org/lmodel/calm/CalmTimeUnit
    description: A unit of time with a value and a unit type.
    examples:
    - object:
        unit: seconds
        value: 30
    - object:
        unit: minutes
        value: 15
    - object:
        unit: hours
        value: 1
    - object:
        unit: days
        value: 7
    from_schema: https://w3id.org/lmodel/calm/calm_units
    exact_mappings:
    - calm_meta:units.json#/defs/time-unit
    slots:
    - calmTimeUnit__unit_of_time
    - calmTimeUnit__value
    attributes:
      unit_of_time:
        name: unit_of_time
        description: The unit of time (e.g., seconds, minutes, hours).
        aliases:
        - unit
        range: CalmTimeUnitName
        required: true
      value:
        name: value
        description: The numeric value representing the amount of time.
        range: float
        required: true
        minimum_value: 0
    class_uri: calm:CalmTimeUnit
  CalmRateUnit:
    name: CalmRateUnit
    definition_uri: https://w3id.org/lmodel/calm/CalmRateUnit
    description: A unit representing a rate (e.g., operations per second).
    examples:
    - object:
        rate: 30
        per: second
    - object:
        rate: 1000
        per: minute
    - object:
        rate: 5
        per: millisecond
    from_schema: https://w3id.org/lmodel/calm/calm_units
    exact_mappings:
    - calm_meta:units.json#/defs/rate-unit
    slots:
    - calmRateUnit__rate
    - calmRateUnit__per
    attributes:
      rate:
        name: rate
        description: The numeric value representing the rate.
        range: float
        required: true
        minimum_value: 0
      per:
        name: per
        description: The time unit defining the rate interval.
        range: CalmRateInterval
        required: true
    class_uri: calm:CalmRateUnit
