name: calm
annotations:
  upstream_tag:
    tag: upstream_tag
    value: v1.3
  upstream_commit:
    tag: upstream_commit
    value: 47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d
  upstream_release_date:
    tag: upstream_release_date
    value: '2026-10-24'
  upstream_license:
    tag: upstream_license
