name: calm
description: LinkML representation of the FINOS Common Architecture Language Model
  (CALM) 1.2 specification. CALM is a declarative, JSON-based modeling language for
  describing complex software architectures (nodes, relationships, controls, flows,
  decorators, timelines, evidence, and units). This LinkML schema is generated from
  the CALM JSON-Schema meta files.
title: Common Architecture Language Model (CALM)
source: https://calm.finos.org/release/1.2/meta/calm.json
see_also:
- https://calm.finos.org/
- https://github.com/finos/architecture-as-code
id: https://w3id.org/lmodel/calm
version: '1.2'
imports:
- linkml:types
license: Apache-2.0
prefixes:
  calm:
    prefix_prefix: calm
    prefix_reference: https://w3id.org/lmodel/calm/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  dct:
    prefix_prefix: dct
    prefix_reference: http://purl.org/dc/terms/
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  rdf:
    prefix_prefix: rdf
    prefix_reference: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
  owl:
    prefix_prefix: owl
    prefix_reference: http://www.w3.org/2002/07/owl#
  prov:
    prefix_prefix: prov
    prefix_reference: http://www.w3.org/ns/prov#
  finos_calm:
    prefix_prefix: finos_calm
    prefix_reference: https://calm.finos.org/release/1.2/meta/
  attack:
    prefix_prefix: attack
    prefix_reference: https://w3id.org/lmodel/attack/
  capec:
    prefix_prefix: capec
    prefix_reference: https://w3id.org/lmodel/capec/
  cis_controls:
    prefix_prefix: cis_controls
    prefix_reference: https://w3id.org/lmodel/cis-controls/
  dpv:
    prefix_prefix: dpv
    prefix_reference: https://w3id.org/lmodel/dpv/
  fluxnova_bpmn_platform:
    prefix_prefix: fluxnova_bpmn_platform
    prefix_reference: https://w3id.org/lmodel/fluxnova-bpm-platform/
  gist:
    prefix_prefix: gist
    prefix_reference: https://w3id.org/lmodel/gist/
  iso27001:
    prefix_prefix: iso27001
    prefix_reference: https://w3id.org/lmodel/iso27001/
  nist_csf_v2:
    prefix_prefix: nist_csf_v2
    prefix_reference: https://w3id.org/lmodel/nist-csf-v2/
  nist_sp_800_53:
    prefix_prefix: nist_sp_800_53
    prefix_reference: https://w3id.org/lmodel/nist-sp-800-53/
  ocsf:
    prefix_prefix: ocsf
    prefix_reference: https://w3id.org/lmodel/ocsf/
  oscal:
    prefix_prefix: oscal
    prefix_reference: https://w3id.org/lmodel/oscal/
  stix:
    prefix_prefix: stix
    prefix_reference: https://w3id.org/lmodel/stix/
default_prefix: calm
default_range: string
subsets:
  core:
    name: core
    definition_uri: https://w3id.org/lmodel/calm/Core
    description: Core architecture vocabulary (nodes, relationships, decisions).
    from_schema: https://w3id.org/lmodel/calm
  control_framework:
    name: control_framework
    definition_uri: https://w3id.org/lmodel/calm/ControlFramework
    description: 'Control framework: controls, requirements, evidence.'
    from_schema: https://w3id.org/lmodel/calm
  flow_modeling:
    name: flow_modeling
    definition_uri: https://w3id.org/lmodel/calm/FlowModeling
    description: 'Business flow modeling: flows and transitions.'
    from_schema: https://w3id.org/lmodel/calm
  interface_defs:
    name: interface_defs
    definition_uri: https://w3id.org/lmodel/calm/InterfaceDefs
    description: Interface definitions exposed by nodes.
    from_schema: https://w3id.org/lmodel/calm
  decorators:
    name: decorators
    definition_uri: https://w3id.org/lmodel/calm/Decorators
    description: Cross-cutting decorators that annotate elements.
    from_schema: https://w3id.org/lmodel/calm
  timeline:
    name: timeline
    definition_uri: https://w3id.org/lmodel/calm/Timeline
    description: Time-based architecture snapshots (moments).
    from_schema: https://w3id.org/lmodel/calm
  units:
    name: units
    definition_uri: https://w3id.org/lmodel/calm/Units
    description: Quantity and rate unit primitives.
    from_schema: https://w3id.org/lmodel/calm
types:
  CronExpression:
    name: CronExpression
    definition_uri: https://w3id.org/lmodel/calm/CronExpression
    description: A Unix-style cron expression (minute, hour, day, month, weekday).
    from_schema: https://w3id.org/lmodel/calm
    base: str
    uri: xsd:string
    pattern: ^([0-5]?\d)\s([01]?\d|2[0-3])\s(3[01]|[12]\d|0?[1-9])\s(1[0-2]|0?[1-9])\s([0-6])$
  Metadata:
    name: Metadata
    definition_uri: https://w3id.org/lmodel/calm/Metadata
    description: Opaque key/value metadata payload. JSON-Schema allows either an object
      or an array of objects; in LinkML this is modeled as a permissive string type
      that downstream consumers parse as JSON.
    from_schema: https://w3id.org/lmodel/calm
    base: str
    uri: xsd:string
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  Protocol:
    name: Protocol
    definition_uri: https://w3id.org/lmodel/calm/Protocol
    description: Wire-level protocol used by a relationship.
    from_schema: https://w3id.org/lmodel/calm
    permissible_values:
      HTTP:
        text: HTTP
        description: The HTTP protocol.
        meaning: calm:protocol/HTTP
      HTTPS:
        text: HTTPS
        description: The HTTPS protocol.
        meaning: calm:protocol/HTTPS
      FTP:
        text: FTP
        description: The FTP protocol.
        meaning: calm:protocol/FTP
      SFTP:
        text: SFTP
        description: The SFTP protocol.
        meaning: calm:protocol/SFTP
      JDBC:
        text: JDBC
        description: The JDBC protocol.
        meaning: calm:protocol/JDBC
      WebSocket:
        text: WebSocket
        description: The WebSocket protocol.
        meaning: calm:protocol/WebSocket
      SocketIO:
        text: SocketIO
        description: The SocketIO protocol.
        meaning: calm:protocol/SocketIO
      LDAP:
        text: LDAP
        description: The LDAP protocol.
        meaning: calm:protocol/LDAP
      AMQP:
        text: AMQP
        description: The AMQP protocol.
        meaning: calm:protocol/AMQP
      TLS:
        text: TLS
        description: The TLS protocol.
        meaning: calm:protocol/TLS
      mTLS:
        text: mTLS
        description: The mTLS protocol.
        meaning: calm:protocol/mTLS
      TCP:
        text: TCP
        description: The TCP protocol.
        meaning: calm:protocol/TCP
  NodeType:
    name: NodeType
    definition_uri: https://w3id.org/lmodel/calm/NodeType
    description: Category of architecture node. The CALM JSON-Schema allows arbitrary
      strings; this enum lists the canonical values plus an escape hatch via ``any_of``
      on the slot.
    from_schema: https://w3id.org/lmodel/calm
    permissible_values:
      actor:
        text: actor
        description: A actor node.
        meaning: calm:node-type/actor
      ecosystem:
        text: ecosystem
        description: A ecosystem node.
        meaning: calm:node-type/ecosystem
      system:
        text: system
        description: A system node.
        meaning: calm:node-type/system
      service:
        text: service
        description: A service node.
        meaning: calm:node-type/service
      database:
        text: database
        description: A database node.
        meaning: calm:node-type/database
      network:
        text: network
        description: A network node.
        meaning: calm:node-type/network
      ldap:
        text: ldap
        description: A ldap node.
        meaning: calm:node-type/ldap
      webclient:
        text: webclient
        description: A webclient node.
        meaning: calm:node-type/webclient
      data_asset:
        text: data_asset
        description: A data-asset node.
        meaning: calm:node-type/data-asset
  TimeUnitName:
    name: TimeUnitName
    definition_uri: https://w3id.org/lmodel/calm/TimeUnitName
    description: Named unit of time used by ``TimeUnit``.
    from_schema: https://w3id.org/lmodel/calm
    permissible_values:
      nanoseconds:
        text: nanoseconds
        description: 'Time unit: nanoseconds.'
      microseconds:
        text: microseconds
        description: 'Time unit: microseconds.'
      milliseconds:
        text: milliseconds
        description: 'Time unit: milliseconds.'
      seconds:
        text: seconds
        description: 'Time unit: seconds.'
      minutes:
        text: minutes
        description: 'Time unit: minutes.'
      hours:
        text: hours
        description: 'Time unit: hours.'
      days:
        text: days
        description: 'Time unit: days.'
      weeks:
        text: weeks
        description: 'Time unit: weeks.'
      months:
        text: months
        description: 'Time unit: months.'
      quarters:
        text: quarters
        description: 'Time unit: quarters.'
      years:
        text: years
        description: 'Time unit: years.'
  RatePerUnit:
    name: RatePerUnit
    definition_uri: https://w3id.org/lmodel/calm/RatePerUnit
    description: Time interval denominator used by ``RateUnit``.
    from_schema: https://w3id.org/lmodel/calm
    permissible_values:
      nanosecond:
        text: nanosecond
        description: 'Rate denominator: per nanosecond.'
      microsecond:
        text: microsecond
        description: 'Rate denominator: per microsecond.'
      millisecond:
        text: millisecond
        description: 'Rate denominator: per millisecond.'
      second:
        text: second
        description: 'Rate denominator: per second.'
      minute:
        text: minute
        description: 'Rate denominator: per minute.'
      hour:
        text: hour
        description: 'Rate denominator: per hour.'
      day:
        text: day
        description: 'Rate denominator: per day.'
      week:
        text: week
        description: 'Rate denominator: per week.'
      month:
        text: month
        description: 'Rate denominator: per month.'
      quarter:
        text: quarter
        description: 'Rate denominator: per quarter.'
      year:
        text: year
        description: 'Rate denominator: per year.'
  TransitionDirection:
    name: TransitionDirection
    definition_uri: https://w3id.org/lmodel/calm/TransitionDirection
    description: Direction of flow on a transition.
    from_schema: https://w3id.org/lmodel/calm
    permissible_values:
      source_to_destination:
        text: source_to_destination
        description: 'Flow direction: source-to-destination.'
      destination_to_source:
        text: destination_to_source
        description: 'Flow direction: destination-to-source.'
  RelationshipKind:
    name: RelationshipKind
    definition_uri: https://w3id.org/lmodel/calm/RelationshipKind
    description: 'Discriminator for the variant of a ``relationship-type``: exactly
      one of the following keys is set on a relationship''s ``relationship-type``.'
    from_schema: https://w3id.org/lmodel/calm
    permissible_values:
      interacts:
        text: interacts
        description: Actor-to-nodes interaction.
      connects:
        text: connects
        description: Interface-to-interface connection.
      deployed_in:
        text: deployed_in
        description: 'Containment: nodes deployed in a container.'
      composed_of:
        text: composed_of
        description: 'Composition: nodes composed by a container.'
      options:
        text: options
        description: A set of alternative decisions.
slots:
  nodes:
    name: nodes
    definition_uri: https://w3id.org/lmodel/calm/nodes
    from_schema: https://w3id.org/lmodel/calm
    slot_uri: calm:nodes
    owner: Decision
    domain_of:
    - Architecture
    - InteractsRelationship
    - DeployedInRelationship
    - ComposedOfRelationship
    - Decision
    range: Node
    multivalued: true
  relationships:
    name: relationships
    definition_uri: https://w3id.org/lmodel/calm/relationships
    from_schema: https://w3id.org/lmodel/calm
    slot_uri: calm:relationships
    owner: Decision
    domain_of:
    - Architecture
    - Decision
    range: Relationship
    multivalued: true
  metadata:
    name: metadata
    definition_uri: https://w3id.org/lmodel/calm/metadata
    from_schema: https://w3id.org/lmodel/calm
    slot_uri: calm:metadata
    owner: Timeline
    domain_of:
    - Architecture
    - Node
    - Relationship
    - Flow
    - Timeline
    range: Metadata
  controls:
    name: controls
    definition_uri: https://w3id.org/lmodel/calm/controls
    from_schema: https://w3id.org/lmodel/calm
    slot_uri: calm:controls
    owner: Flow
    domain_of:
    - Architecture
    - Node
    - Relationship
    - Decision
    - Flow
    range: Control
    inlined: true
    inlined_as_list: true
  flows:
    name: flows
    definition_uri: https://w3id.org/lmodel/calm/flows
    from_schema: https://w3id.org/lmodel/calm
    slot_uri: calm:flows
    owner: Architecture
    domain_of:
    - Architecture
    range: Flow
    multivalued: true
  adrs:
    name: adrs
    definition_uri: https://w3id.org/lmodel/calm/adrs
    description: External links to ADRs (Architecture Decision Records) or similar
      documents that provide context or decisions related to the architecture. These
      can be URLs or references to internal documentation.
    from_schema: https://w3id.org/lmodel/calm
    slot_uri: calm:adrs
    owner: NodeMoment
    domain_of:
    - Architecture
    - NodeMoment
    range: string
    multivalued: true
  unique_id:
    name: unique_id
    definition_uri: https://w3id.org/lmodel/calm/unique_id
    description: Stable opaque identifier used to cross-link CALM elements.
    from_schema: https://w3id.org/lmodel/calm
    aliases:
    - unique-id
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: InterfaceType
    domain_of:
    - Node
    - Relationship
    - Decorator
    - Flow
    - InterfaceDefinition
    - InterfaceType
    range: string
    required: true
  node_type:
    name: node_type
    definition_uri: https://w3id.org/lmodel/calm/node_type
    description: Category of the node (system, service, actor, etc.).
    from_schema: https://w3id.org/lmodel/calm
    aliases:
    - node-type
    slot_uri: calm:node_type
    owner: NodeMoment
    domain_of:
    - Node
    - NodeMoment
    range: NodeType
    required: true
    any_of:
    - range: NodeType
    - range: string
  name:
    name: name
